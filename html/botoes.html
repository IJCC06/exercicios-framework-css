<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Materialize</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
    <nav>
        <div class="nav-wrapper">
            <a href="../index.html" class="brand-logo">Materialize</a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="grid.html">Grid</a></li>
                <li><a href="botoes.html">Botões</a></li>
                <li><a href="forms.html">Formulários</a></li>
            </ul>
        </div>

    <div class="container">
        <h1 class="center">Aprendendo Materialize CSS - Botões</h1>

        <a class="waves-effect waves-light btn">button</a>
        <a class="waves-effect waves-light btn">
            <i class="material-icons left">cloud</i>button
        </a>
        <a class="waves-effect waves-light btn">
            <i class="material-icons right">cloud</i>button
        </a>
        <a class="waves-effect waves-light btn">

        </a>

        <div class="row">
            <a class="waves-effect waves-light btn-large">Button</a>
            <a class="waves-effect waves-light btn-large">
                <i class="material-icons left">cloud</i>button
            </a>
            <a class="waves-effect waves-light btn-large">
