<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materialize</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<style>
    .col {
        border: 1px solid;
        height: 50px;
        background-color: pink;
    }
</style>

<body>
    <nav>
        <div class="nav-wrapper">
            <a href="../index.html" class="brand-logo">Materialize</a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="grid.html">Grid</a></li>
                <li><a href="botoes.html">Botões</a></li>
                <li><a href="forms.html">Formulários</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1 class="center">Aprendendo Materialize Grid</h1>

        <div class="row">
            <h4>Dividindo em 12 colunas</h4>
            <div class="col s1">1</div>
            <div class="col s1">2</div>
            <div class="col s1">3</div>
            <div class="col s1">4</div>
            <div class="col s1">5</div>
            <div class="col s1">6</div>
            <div class="col s1">7</div>
            <div class="col s1">8</div>
            <div class="col s1">9</div>
            <div class="col s1">10</div>
            <div class="col s1">11</div>
            <div class="col s1">12</div>
        </div>

        <div class="row">
            <h4>Dividindo em 4 colunas</h4>
            <div class="col s3">1</div>
            <div class="col s3">2</div>
            <div class="col s3">3</div>
            <div class="col s3">4</div>
        </div>

        <div class="row">
            <h4>Dividindo em 2 colunas</h4>
            <div class="col s4">1</div>
            <div class="col s8">2</div>
        </div>

        <div class="row">
            <h2>Centralizando 4 colunas</h2>
            <div class="col s4 offset-s4">Conteúdo Centralizado</div>
        </div>
    </div>
</body>

</html>
